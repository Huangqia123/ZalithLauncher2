name: Publish BlockNest Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK with gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p out
          gh run download 44858757326 -n BlockNest-debug-arm64 -D out --repo ${{ github.repository }}
          cd out
          ls -la
          rm -f *.crdownload || true
          apk=$(ls *.apk | head -1)
          if [ "$apk" != "BlockNest-2.8.2-blocknest.3-arm64-v8a.apk" ]; then
            mv "$apk" BlockNest-2.8.2-blocknest.3-arm64-v8a.apk
          fi
          ls -la

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8.2-blocknest.3
          name: "BlockNest 2.8.2 Beta（衍生构建）— release 优化包，修复滑动卡顿"
          prerelease: false
          body: |
            ## BlockNest 2.8.2 Beta（基于 ZalithLauncher2 的衍生构建）

            本版本基于官方 **ZalithLauncher2 2.8.2（versionCode 200049）** 二次开发，遵循 GNU GPL v3。

            ### 本次更新（第三版 Beta）
            - **修复滑动异常卡顿**：此前两版都是 Debug 包（未做 R8 优化/资源压缩），列表与滚动明显卡顿。
              本版改为 **Release 优化包**（R8 代码压缩 + 资源优化 + 签名校验安装），滑动与切页流畅度已恢复正常。
            - **修复「获取更新失败，请稍后再试」**：更新信息改为多源顺序回退
              （jsDelivr → ghfast 镜像 → raw.githubusercontent → GitHub Contents API），国内网络下也能正常检查更新。
            - 顺手清理了仓库里因网页上传叠出来的多层错位 workflow 文件，构建流程已稳定。

            ### 版本信息
            - 显示名 BlockNest，包名 `com.blocknest.launcher`
            - versionName `2.8.2-blocknest.3`，versionCode `200051`
            - 底层源码为官方 2.8.2（200049）
            - 构建类型 release（优化后），使用仓库自带 debug keystore 签名（CI 无上游私有签名密钥）

            ### 安装包
            - `BlockNest-2.8.2-blocknest.3-arm64-v8a.apk`（arm64-v8a，适用于绝大多数现代安卓手机/平板）
            - 覆盖安装前请先卸载旧版（签名与 Debug 包一致但版本不同，建议直接覆盖；若提示冲突则先卸载）
            - 安装前请允许「未知来源」

            ### 说明
            - 应用名 BlockNest、全新图标、青绿主题色板、登录列表内置 LittleSkin
            - 上游功能与协议保持一致，仅为界面、品牌层与上述修复改造
            完整修改声明见 `MODIFICATIONS.md`。
          files: out/*.apk
