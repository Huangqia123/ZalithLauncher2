name: Publish BlockNest Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK with gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p out
          gh run download 43580474252 -n BlockNest-debug-arm64 -D out --repo ${{ github.repository }}
          cd out
          ls -la
          rm -f *.crdownload || true

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.2-blocknest.1
          name: "BlockNest 2.7.2 (衍生构建) — 修复关于页与更新源"
          prerelease: true
          body: |
            ## BlockNest 2.7.2（基于 ZalithLauncher2 的衍生构建）

            本版本基于 [ZalithLauncher2](https://github.com/ZalithLauncher/ZalithLauncher2) 二次开发，遵循 GNU GPL v3。

            ### 本次修复
            - 设置 → 关于 → **项目地址**：改指向本仓库（不再跳官方 ZalithLauncher2）
            - **检查更新**：更新源指向本仓库 `update/v2/latest_version_md.json`，不再调用官方 Zalith-Info 与 miawa.cn 镜像
            - 已移除原仓库自带的官方 CI 工作流

            ### 安装包
            - `BlockNest-Debug-2.7.2-arm64-v8a.apk`（arm64-v8a，适用于绝大多数现代安卓手机/平板）
            - 包名 `com.blocknest.launcher`
            - 调试签名包，安装前请允许「未知来源」

            ### 说明
            - 应用名 BlockNest、全新图标、青绿主题色板
            - 上游功能与协议保持一致，仅为界面与品牌层改造
          files: out/*.apk
